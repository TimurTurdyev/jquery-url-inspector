<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>jquery-url-inspector</title>
  <style>
    body {
      width: 380px;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      background: #1e1e2e;
      color: #e0e0e0;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .name { font-weight: 700; color: #fff; flex: 1; }

    .bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .label {
      color: #9aa0b0;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .list { max-height: 360px; overflow-y: auto; }

    .item {
      background: #2a2a3c;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
    }

    .item .meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: #9aa0b0;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .item .url {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
      color: #7ee6a8;
      word-break: break-all;
      max-height: 48px;
      overflow: hidden;
    }

    .item .actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .empty {
      color: #9aa0b0;
      font-size: 12px;
      background: #2a2a3c;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
    }

    button {
      font: inherit;
      font-weight: 600;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      background: #3a3a4e;
      color: #cfd3e0;
    }

    button:hover { background: #4a4a60; }
    button.done { background: #2e7d4f; color: #fff; }

    button.link {
      background: transparent;
      color: #9aa0b0;
      padding: 2px 4px;
    }

    button.link:hover { background: transparent; color: #fff; }
  </style>
</head>
<body>
  <div class="head">
    <span class="name">jquery-url-inspector</span>
    <button class="link" id="open-options">Настройки</button>
  </div>

  <div class="bar">
    <span class="label">Перехваченные запросы</span>
    <button class="link" id="clear">Очистить</button>
  </div>

  <div class="list" id="list"></div>

  <script src="../shared/log.js"></script>
  <script src="../shared/url.js"></script>
  <script src="../shared/rules.js"></script>
  <script src="../storage/rules-store.js"></script>
  <script src="../storage/history-store.js"></script>
  <script src="action.js"></script>
</body>
</html>
